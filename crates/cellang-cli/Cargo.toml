[package]
name = "cellang-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Interpreter CLI for the CEL expression language"
repository = "https://github.com/nikola-jokic/cellang"
readme = "README.md"
keywords = ["cli", "cel", "expression", "language", "interpreter", "rust"]
categories = ["cli", "programming-language"]
publish = false

[dependencies]
clap = { version = "^4", features = ["derive"] }
miette = { version = "^7", features = ["fancy"] }
cellang = { workspace = true }
serde_json = "^1"
serde = { version = "^1" }
